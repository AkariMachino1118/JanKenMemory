<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ジャンケン帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --ground:#f6f1e3; --ground-2:#efe8d5; --surface:#fffdf6; --surface-2:#f9f3e3;
    --ink:#221c12; --ink-soft:#5f5541; --muted:#948a72;
    --line:rgba(34,28,18,0.13); --line-strong:rgba(34,28,18,0.24);
    --accent:#a9762f; --accent-strong:#8a5e22; --accent-soft:rgba(169,118,47,0.14); --accent-ink:#ffffff;
    --good:#0ca30c; --good-soft:rgba(12,163,12,0.13);
    --bad:#c23b34; --bad-soft:rgba(194,59,52,0.13);
    --p1:#2a78d6; --p2:#d1631f; --p3:#1a9a6d; --p4:#8a4ac2; --p5:#c2384f; --p6:#3a8f8f;
    --shadow: 0 1px 2px rgba(34,28,18,0.06), 0 8px 20px -12px rgba(34,28,18,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --ground:#181310; --ground-2:#1f1912; --surface:#221b14; --surface-2:#2a2118;
      --ink:#f4ecd9; --ink-soft:#cabca3; --muted:#93876e;
      --line:rgba(244,236,217,0.12); --line-strong:rgba(244,236,217,0.22);
      --accent:#dfa858; --accent-strong:#efc07d; --accent-soft:rgba(223,168,88,0.16); --accent-ink:#231a0d;
      --good:#3fc23f; --good-soft:rgba(63,194,63,0.16);
      --bad:#e8756c; --bad-soft:rgba(232,117,108,0.16);
      --p1:#5b9ce9; --p2:#e8873f; --p3:#33b98a; --p4:#af8ce0; --p5:#e8707f; --p6:#5cb8b8;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 26px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ground:#181310; --ground-2:#1f1912; --surface:#221b14; --surface-2:#2a2118;
    --ink:#f4ecd9; --ink-soft:#cabca3; --muted:#93876e;
    --line:rgba(244,236,217,0.12); --line-strong:rgba(244,236,217,0.22);
    --accent:#dfa858; --accent-strong:#efc07d; --accent-soft:rgba(223,168,88,0.16); --accent-ink:#231a0d;
    --good:#3fc23f; --good-soft:rgba(63,194,63,0.16);
    --bad:#e8756c; --bad-soft:rgba(232,117,108,0.16);
    --p1:#5b9ce9; --p2:#e8873f; --p3:#33b98a; --p4:#af8ce0; --p5:#e8707f; --p6:#5cb8b8;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 26px -14px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html{background:var(--ground);}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;}
  a{color:var(--accent-strong);}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px 64px;}
  header.top{padding:30px 18px 20px;background:radial-gradient(120% 140% at 15% -10%, var(--accent-soft), transparent 55%), var(--ground);border-bottom:1px solid var(--line);}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-strong);font-weight:700;display:flex;align-items:center;gap:8px;margin:0 0 10px;}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;}
  h1.title{font-family:"Shippori Mincho",serif;font-weight:800;font-size:clamp(26px,7vw,34px);margin:0 0 10px;letter-spacing:.02em;}
  .whoami{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--ink-soft);flex-wrap:wrap;}
  .whoami b{color:var(--ink);}
  .whoami .switch{font-size:12px;color:var(--accent-strong);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;padding:0;}
  section{margin-top:30px;}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;}
  h2{font-family:"Shippori Mincho",serif;font-size:18px;font-weight:600;margin:0;letter-spacing:.01em;}
  .sec-note{font-size:11.5px;color:var(--muted);white-space:nowrap;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
  .pad{padding:16px;}
  button.btn{font-family:inherit;font-size:14px;font-weight:700;border:none;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);}
  button.btn:active{transform:translateY(1px);}
  button.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line-strong);}
  button.btn.small{padding:6px 12px;font-size:12.5px;border-radius:8px;}
  button.btn:disabled{opacity:.45;cursor:default;}
  input.field{font-family:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);width:100%;}
  label.chk{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 2px;}

  /* identity gate */
  #gate{position:fixed;inset:0;background:var(--ground);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;}
  #gate .box{max-width:380px;width:100%;}
  #gate h1{font-family:"Shippori Mincho",serif;font-size:26px;margin:0 0 6px;}
  #gate p.lead{color:var(--ink-soft);font-size:13.5px;margin:0 0 20px;}
  #gate .tabs{display:flex;gap:8px;margin-bottom:14px;}
  #gate .tabs button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-soft);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;}
  #gate .tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  #gate .panel{display:flex;flex-direction:column;gap:10px;}
  #gate .err{color:var(--bad);font-size:12.5px;min-height:1em;}
  #gate .viewonly{margin-top:18px;text-align:center;font-size:12.5px;}
  .code-reveal{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:10px;padding:14px;text-align:center;margin-top:8px;}
  .code-reveal .code{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;letter-spacing:.08em;color:var(--accent-strong);margin:4px 0;}
  .code-reveal .note{font-size:11.5px;color:var(--ink-soft);}

  /* members */
  .member-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);}
  .member-row:first-child{border-top:none;}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .member-row .name{font-weight:700;font-size:14.5px;flex:1;}
  .member-row .code{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);}
  .member-row.inactive{opacity:.45;}
  .add-member{padding:12px 14px;border-top:1px dashed var(--line-strong);display:flex;gap:8px;}
  .add-member input{flex:1;}

  /* round */
  .participant-pick{display:flex;flex-direction:column;gap:2px;margin-bottom:14px;}
  .mode-pick{display:flex;gap:8px;margin-bottom:16px;}
  .mode-pick button{flex:1;}
  .pool-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .pool-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:700;}
  .pool-chip.done{background:var(--good-soft);color:var(--good);border-color:transparent;}
  .hand-picker-row{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line);}
  .hand-picker-row:first-child{border-top:none;padding-top:0;}
  .hpr-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;}
  .hpr-name .tag{font-size:10px;font-weight:700;color:var(--accent-strong);background:var(--accent-soft);padding:1px 8px;border-radius:999px;}
  .hand-picker{display:flex;gap:8px;}
  .hand-picker button{flex:1;}
  .status-msg{font-size:13.5px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:12px 14px;}
  .pitch-log{margin-top:14px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);}
  .pitch-log .res{font-weight:700;}

  /* standings/habits/heat/trend/records — same as static build */
  .standings{display:flex;flex-direction:column;gap:10px;}
  .stand-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px 16px;}
  .rank{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;color:var(--muted);width:20px;}
  .stand-name-row{display:flex;align-items:center;gap:8px;}
  .stand-name{font-weight:700;font-size:16px;}
  .stand-meta{font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;}
  .stand-points{text-align:right;}
  .pts-val{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;margin-top:3px;letter-spacing:.02em;}
  .pill.good{background:var(--good-soft);color:var(--good);}
  .pill.bad{background:var(--bad-soft);color:var(--bad);}

  .habit-card{padding:16px;display:flex;flex-direction:column;gap:16px;}
  .habit-legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap;}
  .habit-legend span{display:inline-flex;align-items:center;gap:6px;}
  .habit-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .habit-row{display:flex;flex-direction:column;gap:6px;}
  .habit-row-top{display:flex;justify-content:space-between;font-size:13px;}
  .habit-row-top .name{font-weight:700;display:flex;align-items:center;gap:7px;}
  .habit-row-top .total{color:var(--muted);font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;}
  .habit-bar{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);}
  .habit-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--accent-ink);font-family:"JetBrains Mono",monospace;min-width:0;white-space:nowrap;overflow:hidden;}
  .habit-seg+.habit-seg{border-left:2px solid var(--surface);}

  .heat-card{padding:16px 10px;overflow-x:auto;}
  table.heat{border-collapse:collapse;width:100%;table-layout:fixed;}
  table.heat th,table.heat td{text-align:center;padding:7px 2px;font-size:12.5px;}
  table.heat th:first-child,table.heat td:first-child{width:64px;}
  table.heat thead th{color:var(--muted);font-weight:700;font-size:11px;}
  table.heat th.rowhead{text-align:left;font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:5px;padding-left:4px;white-space:nowrap;}
  table.heat td.cell{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-weight:700;border-radius:8px;}
  table.heat td.cell.zero{color:var(--muted);font-weight:500;}

  .trend-card{padding:16px 16px 8px;}
  .trend-legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);margin-bottom:14px;flex-wrap:wrap;}
  .trend-legend span{display:inline-flex;align-items:center;gap:6px;}
  .trend-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .trend-groups{display:flex;align-items:flex-end;gap:14px;height:150px;border-bottom:1px solid var(--line-strong);padding:0 2px;}
  .trend-group{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;}
  .trend-bars{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center;}
  .trend-bar{width:9px;border-radius:3px 3px 0 0;position:relative;min-height:2px;}
  .trend-bar .v{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9.5px;font-family:"JetBrains Mono",monospace;color:var(--muted);font-variant-numeric:tabular-nums;}
  .trend-label{margin-top:8px;font-size:11px;color:var(--muted);text-align:center;}

  .records{display:flex;flex-direction:column;gap:10px;}
  .rec{padding:14px 16px;}
  .rec-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .rec-date{display:flex;align-items:baseline;gap:6px;}
  .rec-date .d{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;}
  .badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;border:1px solid var(--line-strong);color:var(--ink-soft);letter-spacing:.02em;}
  .badge.otoko{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent;}
  .rec-hands{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .hand-chip{flex:1;min-width:72px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);text-align:center;}
  .hand-chip .who{font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;}
  .hand-chip .hand{font-size:14px;font-weight:700;}
  .hand-chip.lose{background:var(--bad-soft);border-color:transparent;}
  .hand-chip.lose .hand{color:var(--bad);}
  .hand-chip .tag{font-size:9.5px;font-weight:700;color:var(--accent-strong);}
  .streak{font-size:12px;font-weight:700;color:var(--bad);}
  .rec details{margin-top:8px;}
  .rec summary{cursor:pointer;font-size:12px;color:var(--accent-strong);font-weight:700;list-style:none;user-select:none;}
  .rec summary::-webkit-details-marker{display:none;}
  .pitch-list{margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line-strong);display:flex;flex-direction:column;gap:6px;}
  .pitch{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;font-size:12px;}
  .pitch .hs{font-family:"JetBrains Mono",monospace;color:var(--ink-soft);}
  .pitch .res{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;}
  .res.decide{background:var(--bad-soft);color:var(--bad);}
  .res.advance{background:var(--good-soft);color:var(--good);}
  .res.draw{background:var(--surface-2);color:var(--muted);border:1px solid var(--line);}
  .empty{padding:20px;text-align:center;color:var(--muted);font-size:13px;}
  footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);text-align:center;}
</style>
</head>
<body>

<div id="gate">
  <div class="box card pad">
    <h1>ジャンケン帳</h1>
    <p class="lead">友達内だけのじゃんけん結果ノートです。自分のIDでログインしてください。</p>
    <div class="tabs">
      <button id="tabLogin" class="on">IDでログイン</button>
      <button id="tabJoin">はじめて参加する</button>
    </div>
    <div id="panelLogin" class="panel">
      <input id="loginCode" class="field" placeholder="自分のIDを入力（例: 384920）" autocomplete="off" inputmode="numeric" pattern="[0-9]*">
      <button id="btnLogin" class="btn">ログイン</button>
      <div class="err" id="loginErr"></div>
    </div>
    <div id="panelJoin" class="panel" style="display:none">
      <input id="joinName" class="field" placeholder="表示名（例: 田中）" autocomplete="off">
      <input id="joinId" class="field" placeholder="希望するID（数字。例: 3948）" autocomplete="off" inputmode="numeric" pattern="[0-9]*">
      <button id="btnJoin" class="btn">このIDで参加する</button>
      <div class="err" id="joinErr"></div>
      <div class="code-reveal" id="codeReveal" style="display:none">
        <div class="note">登録できました。あなたのIDです</div>
        <div class="code" id="codeRevealVal"></div>
        <div class="note">次回からこのIDでログインできます</div>
      </div>
    </div>
    <div class="viewonly"><button id="btnViewOnly" class="switch" style="background:none;border:none;color:var(--accent-strong);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:12.5px;">ログインせず閲覧のみで見る</button></div>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">みんなのじゃんけん記録</p>
    <h1 class="title">ジャンケン帳</h1>
    <div class="whoami" id="whoami"></div>
  </header>

  <section id="sec-season">
    <div class="sec-head"><h2>シーズン</h2></div>
    <div class="card pad" id="season"></div>
  </section>

  <section id="sec-round">
    <div class="sec-head"><h2>対戦</h2><span class="sec-note" id="round-note"></span></div>
    <div class="card pad" id="round"></div>
  </section>

  <section id="sec-members">
    <div class="sec-head"><h2>メンバー</h2><span class="sec-note">追加・脱退はいつでも</span></div>
    <div class="card" id="members"></div>
  </section>

  <section id="sec-standings">
    <div class="sec-head"><h2>現在の貯金・借金</h2><span class="sec-note">勝敗ポイント</span></div>
    <div class="standings" id="standings"></div>
  </section>

  <section id="sec-habits">
    <div class="sec-head"><h2>出し手の癖</h2><span class="sec-note">全投球</span></div>
    <div class="card habit-card" id="habits"></div>
  </section>

  <section id="sec-weekday">
    <div class="sec-head"><h2>曜日別の負け数</h2><span class="sec-note"></span></div>
    <div class="card heat-card"><table class="heat" id="heat"></table></div>
  </section>

  <section id="sec-monthly">
    <div class="sec-head"><h2>月別の負け数</h2><span class="sec-note"></span></div>
    <div class="card trend-card" id="monthly"></div>
  </section>

  <section id="sec-records">
    <div class="sec-head"><h2>対戦記録</h2><span class="sec-note" id="rec-count"></span></div>
    <div class="records" id="records"></div>
  </section>

  <footer>Firebase上で動作する共有ジャンケン帳 ・ データはこの友達グループだけで共有されます</footer>
</div>

<script type="module" src="./app.js?v=7"></script>
</body>
</html>
